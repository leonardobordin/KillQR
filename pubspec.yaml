name: killqr
description: "Offline QR and barcode scanner"
publish_to: 'none'
homepage: https://github.com/leonardobordin/KillQR
repository: https://github.com/leonardobordin/KillQR
issue_tracker: https://github.com/leonardobordin/KillQR/issues
version: 0.1.5+6

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  android_intent_plus: ^6.1.0
  drift: ^2.34.4
  file_selector: ^1.1.0
  flutter_riverpod: ^3.4.3
  flutter_zxing: ^3.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
