name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 before publishing a release.'
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/killqr-release.jks"

      - name: Build signed APK and checksum
        id: package
        shell: bash
        env:
          ORG_GRADLE_PROJECT_killqrReleaseKeystore: ${{ runner.temp }}/killqr-release.jks
          ORG_GRADLE_PROJECT_killqrReleaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_killqrReleaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_killqrReleaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          build_number="$(sed -nE 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$version_name" ] || [ -z "$build_number" ]; then
            echo '::error::Could not read version from pubspec.yaml.'
            exit 1
          fi
          if [ "$tag_version" != "$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version_name."
            exit 1
          fi
          flutter build apk --release --dart-define=GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          mkdir -p dist
          apk="dist/KillQR-$version_name.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" | tee "${apk%.apk}.sha256"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Audit Android artifact
        run: |
          pwsh -NoProfile -File scripts/audit_android.ps1 -ApkPath "dist/KillQR-${{ steps.package.outputs.version_name }}.apk"
          pwsh -NoProfile -File scripts/check_prohibited_dependencies.ps1

      - name: Prepare release notes
        shell: bash
        env:
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          awk -v version="$VERSION_NAME" '
            index($0, "## " version " - ") == 1 { capture=1 }
            capture && index($0, "## ") == 1 && !first { first=1; print; next }
            capture && first && index($0, "## ") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "KillQR $VERSION_NAME" > dist/release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "KillQR ${{ steps.package.outputs.version_name }}" \
            --notes-file dist/release-notes.md \
            "dist/KillQR-${{ steps.package.outputs.version_name }}.apk" \
            "dist/KillQR-${{ steps.package.outputs.version_name }}.sha256"
