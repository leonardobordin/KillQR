Summary: Offline QR and barcode scanner
Description: |
  KillQR scans and creates QR codes and barcodes without an account,
  advertisements, analytics or telemetry. Scans and history stay on the
  device, and the F-Droid build does not request Internet access.
  .
  Import images, PDFs and modern Office documents, create QR codes, and keep an
  optional local history with search, tags, notes and favorites. Export data
  only when you choose to do so.
  .
  The camera is requested only while scanning. External links and actions
  require confirmation. Updates for this build are delivered through F-Droid.
