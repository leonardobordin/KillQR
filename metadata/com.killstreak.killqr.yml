# Copy this file to fdroiddata/metadata/com.killstreak.killqr.yml.
Categories:
  - Utilities
AuthorName: Leonardo Silva Bordin
SourceCode: https://github.com/leonardobordin/KillQR
IssueTracker: https://github.com/leonardobordin/KillQR/issues
License: Apache-2.0
Summary: Offline QR and barcode scanner
Description: |
  Scan and create QR codes and barcodes with a private, offline-first Android
  app. It requires no account, ads, analytics or telemetry.
  .
  Scan with the camera, from images and PDF pages, or from embedded images in
  modern Office documents. Create codes and keep an optional local history
  with search, tags, notes and favorites. Import and export JSON and CSV files
  when you choose.
  .
  The F-Droid build does not request Internet access. Updates are delivered
  through F-Droid. Camera access is requested only while scanning. External
  links and actions require confirmation.
RepoType: git
Repo: https://github.com/leonardobordin/KillQR.git
Changelog: https://github.com/leonardobordin/KillQR/blob/main/CHANGELOG.md
MaintainerNotes: |
  The fdroid flavor omits GitHub update checks and the INTERNET permission.
  SQLite 3.50.2 is vendored in third_party/sqlite and compiled from source by
  the sqlite3 Dart native hook.
Builds:
  - versionName: '0.1.10'
    versionCode: 11
    commit: db974c52bcfa1a59da610611a35199c5060c823f
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.47.2
    ndk: r28b
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --offline
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.10
CurrentVersionCode: 11
